[package]
name = "cutline"
version = "0.1.2"
edition = "2024"
description = "A fast, Snipaste-style screenshot tool: freeze, select, annotate, copy / save / pin."
license = "Apache-2.0"

[features]
# Compile the scripted-input test harness into release builds too (dev/testing only).
devscript = []

[dependencies]
arboard = "3.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "system_fonts"] }
egui_system_font_provider = "0.37.0"
global-hotkey = "0.10.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.18.0"
tao = "0.37.2"
tray-icon = "0.26.1"

# Screen capture on Windows and macOS. Linux talks to the X server itself (src/capture_x11.rs):
# xcap's Linux back ends need a newer libpipewire than Ubuntu 22.04 ships.
[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = "0.9.10"

# Windows-only: DPI awareness, cursor position, foreground permission.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
] }

# macOS: cursor position (Windows uses GetCursorPos, Linux asks the X server).
[target.'cfg(target_os = "macos")'.dependencies]
mouse_position = "0.1.4"

# Linux: windowing back ends for winit (eframe's defaults are turned off above) and the X11 capture.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["x11", "wayland"] }
x11rb = { version = "0.13", features = ["randr"] }

# Windows: embeds assets/icon.ico into the exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# Installers are built with cargo-packager (see .github/workflows/release.yml).
[package.metadata.packager]
product-name = "Cutline"
identifier = "app.cutline.desktop"
description = "A fast, Snipaste-style screenshot tool: freeze, select, annotate, copy / save / pin."
authors = ["Sam Hong"]
license-file = "LICENSE"
out-dir = "dist"
icons = ["assets/32x32.png", "assets/128x128.png", "assets/128x128@2x.png", "assets/icon.ico"]
binaries = [{ path = "cutline", main = true }]

[package.metadata.packager.nsis]
installer-icon = "assets/icon.ico"
display-language-selector = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
